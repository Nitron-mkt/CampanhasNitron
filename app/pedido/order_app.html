<title>Pedido Nitron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: carrinho ("Meu pedido") pré-preenchido pela Nina + abas de categoria onde se inclui mais.
   Nitron navy; verde = penetração/curva A e "no pedido"; violeta = linha nova TECA/MOB. Preço = tabela padrão PV-0003; desconto 10%/15% no total. */
/* Pedido Nitron — tela do lojista.
   Feita para celular primeiro: quem abre isto recebeu o link da Nina no WhatsApp e está num
   Android simples, muitas vezes dentro da loja. Por isso: uma coluna, foto grande, passo a passo
   numerado, e UM botão principal. Cores da marca (vermelho #E53221, turquesa #11ABB3,
   amarelo #FFD402); o verde aparece só no botao que abre o WhatsApp, onde a cor e informacao. */
:root{
  --paper:#faf7f4; --surface:#ffffff; --well:#f4f1ed; --sunken:#efeae5;
  --ink:#1a1512; --ink-2:#5f564f; --ink-3:#8d837b;
  --line:#e7e0d9; --line-2:#f0ebe5;
  --red:#e53221; --red-ink:#c4231a; --red-bg:#fdeceb;
  --turq:#11abb3; --turq-ink:#0b7d83; --turq-bg:#e4f6f7;
  --sol:#ffd402; --sol-ink:#7a5c00; --sol-bg:#fff6cc;
  --zap:#1faa54;
  --shadow:0 1px 2px rgba(26,21,18,.05),0 8px 24px rgba(26,21,18,.07);
  --shadow-up:0 -8px 28px rgba(26,21,18,.13);
  --r:16px; --r-sm:12px;
  --f-disp:"Archivo",system-ui,Segoe UI,sans-serif;
  --f-body:"Hanken Grotesk",system-ui,Segoe UI,sans-serif;
  --barh:150px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15110f; --surface:#1f1a17; --well:#f4f1ed; --sunken:#2a2320;
  --ink:#f6f1ec; --ink-2:#b6aba2; --ink-3:#877d75;
  --line:#352d28; --line-2:#2a2320;
  --red:#ff5a46; --red-ink:#ff7a68; --red-bg:#3a1a16;
  --turq:#3ecad2; --turq-ink:#5ad8df; --turq-bg:#10302f;
  --sol:#ffd402; --sol-ink:#ffdd4d; --sol-bg:#3a2f08;
  --zap:#2fc468;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  --shadow-up:0 -8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15110f; --surface:#1f1a17; --well:#f4f1ed; --sunken:#2a2320;
  --ink:#f6f1ec; --ink-2:#b6aba2; --ink-3:#877d75;
  --line:#352d28; --line-2:#2a2320;
  --red:#ff5a46; --red-ink:#ff7a68; --red-bg:#3a1a16;
  --turq:#3ecad2; --turq-ink:#5ad8df; --turq-bg:#10302f;
  --sol:#ffd402; --sol-ink:#ffdd4d; --sol-bg:#3a2f08;
  --zap:#2fc468;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  --shadow-up:0 -8px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
/* O atributo hidden perdia para .segsel{display:flex} e o seletor de segmento (que e do modo
   interno) aparecia para o cliente. Esta linha devolve a prioridade a quem escreveu hidden. */
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.5;
  padding-bottom:calc(var(--barh) + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Cabecalho: a marca, e de quem veio o link ---- */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px}
.brand{display:flex;align-items:center;gap:11px;min-height:44px}
.brand img{height:34px;width:auto;display:block;flex:0 0 auto}
.brand .who-sent{min-width:0}
.brand .who-sent .t{font-family:var(--f-disp);font-weight:800;font-size:16px;line-height:1.15;color:var(--ink)}
.brand .who-sent .s{font-size:12.5px;color:var(--ink-2);line-height:1.2}
.brand .who-sent .s b{color:var(--red-ink);font-weight:700}
.segsel{margin-left:auto;display:flex;align-items:center;gap:7px;min-width:0}
.segsel label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;font-weight:700}
.segsel select{background:var(--well);color:#1a1512;border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;font-size:13px;font-family:inherit;max-width:230px}
.seghead{max-width:1180px;margin:0 auto;padding:0 16px 10px}
.seghead h1{font-size:15px;color:var(--ink-2);font-weight:700}
.seghead .sub{font-size:12.5px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.seghead .sub b{color:var(--turq-ink);font-weight:800}

/* ---- Trilho dos 3 passos: a instrucao que o lojista precisa ---- */
.steps{background:var(--turq-bg);border-bottom:1px solid var(--line)}
.steps-in{max-width:1180px;margin:0 auto;padding:6px 10px;display:flex;gap:5px}
.step{flex:1;display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:10px;min-width:0}
.step .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--turq);color:#fff;
  font-family:var(--f-disp);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.step .l{font-size:12.5px;font-weight:700;color:var(--turq-ink);line-height:1.15;white-space:nowrap}
.step .l .longo{display:none}
@media (min-width:600px){.step .l .longo{display:inline}}
.step.on{background:var(--surface);box-shadow:var(--shadow)}
.step.on .l{color:var(--ink)}
.step.done .n{background:var(--turq-ink)}

/* ---- Abas de categoria ---- */
.tabwrap{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs{max-width:1180px;margin:0 auto;padding:7px 12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  padding:9px 14px;font-size:14px;font-weight:700;border-radius:999px;white-space:nowrap;min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tab .cnt{font-size:12px;color:var(--ink-3);margin-left:6px;font-weight:700}
.tab[aria-selected="true"] .cnt{color:rgba(255,255,255,.65)}
.tab.mine{border-color:var(--red);color:var(--red-ink)}
.tab.mine .cnt{background:var(--red);color:#fff;padding:1px 8px;border-radius:999px;margin-left:7px}
.tab.mine[aria-selected="true"]{background:var(--red);border-color:var(--red);color:#fff}
.tab.mine[aria-selected="true"] .cnt{background:rgba(255,255,255,.25)}
.tab.teca .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sol);margin-left:6px;vertical-align:middle}

/* ---- Conteudo ---- */
main{max-width:1180px;margin:0 auto;padding:14px 12px}
.panel-intro{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);
  border-radius:var(--r-sm);padding:13px 15px;margin-bottom:14px;font-size:15px;color:var(--ink-2);box-shadow:var(--shadow)}
.panel-intro b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;vertical-align:middle}
.chip.a{background:var(--turq-bg);color:var(--turq-ink)}
.chip.n{background:var(--sol-bg);color:var(--sol-ink)}

.search{display:flex;gap:8px;margin-bottom:14px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:12px;padding:13px 15px;font-size:16px;font-family:inherit}

/* ---- Produtos: no celular e LISTA (foto grande + info), no desktop vira grade ---- */
.grid{display:grid;grid-template-columns:1fr;gap:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:grid;grid-template-columns:132px 1fr;box-shadow:var(--shadow)}
.card.incart{border-color:var(--red);box-shadow:0 0 0 2px var(--red-bg),var(--shadow)}
.imgwrap{position:relative;background:var(--well);display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--line-2);min-height:116px}
.imgwrap img{width:100%;height:100%;object-fit:contain;padding:10px}
.ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#8d837b;
  font-size:11px;text-align:center;padding:12px;font-weight:700}
.badge{position:absolute;top:7px;left:7px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.03em}
.badge.a{background:var(--turq);color:#fff}.badge.b{background:var(--ink);color:#fff}
.badge.c{background:var(--ink-3);color:#fff}.badge.n{background:var(--sol);color:#4a3800}
.unit{display:none}
.rm{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
.body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
.desc{font-weight:700;font-size:15.5px;line-height:1.25;color:var(--ink)}
.ref{font-size:11.5px;color:var(--ink-3)}
.pen{font-size:13px;color:var(--turq-ink);font-weight:700;line-height:1.3}
.fardo{font-size:13.5px;color:var(--ink-2)}
.fardo b{color:var(--ink);font-weight:800}
.ctrl{margin-top:6px;display:flex;flex-direction:column;gap:8px}

/* O gesto que a pagina inteira repete: quantos fardos. Por isso e o maior elemento do card. */
.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);max-width:230px}
.stepper button{width:54px;height:52px;border:0;background:var(--sunken);color:var(--red-ink);font-size:26px;
  font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stepper button:active{background:var(--red-bg)}
.stepper button:disabled{color:var(--ink-3);opacity:.4;cursor:default}
.stepper input{flex:1;min-width:0;width:100%;border:0;text-align:center;font-family:var(--f-disp);font-size:21px;font-weight:800;
  background:transparent;color:var(--ink);padding:0;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none;background:var(--well)}
/* traducao em palavras: o lojista pensa em fardo, mas precisa ver quantas pecas entram */
.conta{font-size:13.5px;color:var(--ink-2);line-height:1.3}
.conta b{color:var(--ink);font-weight:800}
.conta .v{color:var(--red-ink);font-weight:800}
.addbtn{border:2px solid var(--red);background:var(--red);color:#fff;border-radius:13px;padding:13px 14px;
  font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.addbtn:active{background:var(--red-ink)}
.addbtn svg{width:18px;height:18px}
.incartlbl{display:inline-flex;align-items:center;gap:6px;color:var(--red-ink);font-weight:800;font-size:13px;
  background:var(--red-bg);padding:4px 10px;border-radius:999px;align-self:flex-start}
.incartlbl svg{width:15px;height:15px}
.linetot{display:none}
.rmlink{background:transparent;border:0;color:var(--ink-3);font-size:13px;font-weight:700;padding:6px 0;text-decoration:underline;align-self:flex-start}
.empty{text-align:center;color:var(--ink-2);padding:44px 18px;font-size:15.5px;background:var(--surface);
  border:1px dashed var(--line);border-radius:var(--r)}
.empty b{color:var(--ink);display:block;margin-bottom:6px;font-size:17px;font-family:var(--f-disp)}

/* ---- Dados da loja ---- */
.who{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 15px;margin-bottom:14px;box-shadow:var(--shadow)}
.who summary{cursor:pointer;font-weight:800;font-size:15.5px;padding:14px 0;list-style:none;display:flex;align-items:center;gap:9px;white-space:nowrap}
.who summary .dica{display:none;font-weight:500;color:var(--ink-3);font-size:13px}
@media (min-width:600px){.who summary .dica{display:inline}}
.who summary::-webkit-details-marker{display:none}
.who summary .mk{color:var(--red);transition:transform .15s}
.who[open] summary .mk{transform:rotate(90deg)}
.who .fields{display:grid;grid-template-columns:1fr;gap:11px;padding:2px 0 16px}
.who .fields label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:700}
.who .fields input{border:1px solid var(--line);background:var(--well);color:#1a1512;border-radius:11px;padding:13px 13px;font-size:16px;font-family:inherit}

/* ---- Barra do pedido: UM botao principal ---- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
  box-shadow:var(--shadow-up);padding-bottom:env(safe-area-inset-bottom,0px)}
.promo{font-size:13px;font-weight:800;text-align:center;padding:7px 12px;line-height:1.25}
.promo.go{background:var(--sol-bg);color:var(--sol-ink)}
.promo.win{background:var(--sol);color:#4a3800}
.bar-in{max-width:1180px;margin:0 auto;padding:9px 14px 10px;display:flex;align-items:center;gap:12px}
.totals{display:flex;flex-direction:column;gap:0;min-width:0;flex:1}
.totals .k{font-size:12.5px;color:var(--ink-2);display:flex;gap:9px;flex-wrap:wrap}
.totals .k b{color:var(--ink);font-weight:800}
.totals .cap{display:none}
.totals .big{font-family:var(--f-disp);font-size:27px;font-weight:800;color:var(--ink);line-height:1.05}
.totals .dline{font-size:12.5px;color:var(--ink-2)}
.totals .dline s{color:var(--ink-3)}
.totals .dline b{color:var(--red-ink);font-weight:800}
.acts{display:flex;gap:9px;flex:0 0 auto}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:13px;padding:13px 16px;
  font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.wa{background:var(--zap);border-color:var(--zap);color:#fff;font-size:16px;padding:13px 20px}
.btn.wa:active{filter:brightness(.94)}
.btn svg{width:19px;height:19px;display:block;flex:0 0 auto}
/* secundarios: existem, mas nao disputam com o Enviar */
.minor{display:flex;gap:18px;justify-content:center;padding:0 14px 7px;margin-top:-4px}
.minor button{background:transparent;border:0;color:var(--ink-2);font-size:13.5px;font-weight:700;
  text-decoration:underline;padding:4px 2px;display:inline-flex;align-items:center;gap:6px}
.minor svg{width:15px;height:15px}

/* ---- Resumo ---- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(20,14,10,.6);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none!important}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;max-width:560px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.sheet h2{font-size:19px;padding:18px 18px 4px}
.sheet .sub{padding:0 18px 12px;font-size:13.5px;color:var(--ink-2)}
.sheet .scroll{overflow:auto;padding:0 18px}
.sheet pre{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:13px;
  white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;color:#1a1512;margin:0}
.sheet .foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:9px;border-top:1px solid var(--line)}
.sheet .foot .btn{flex:1}
.note{font-size:13px;color:var(--ink-2);background:var(--well);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:12px 18px 0}
.note b{color:#1a1512}
.x{margin-left:auto;background:transparent;border:0;font-size:26px;color:var(--ink-3);line-height:1;padding:4px 10px}
.shhead{display:flex;align-items:flex-start;padding-right:6px}
.toast{position:fixed;left:50%;bottom:calc(var(--barh) + 16px);transform:translateX(-50%) translateY(12px);z-index:120;
  background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-size:14.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- Telas maiores: a lista vira grade ---- */
@media (min-width:600px){
  main{padding:18px 16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  /* Em tela grande o card volta a ser vertical: a foto manda, e e ela que vende. */
  .card{grid-template-columns:1fr}
  .imgwrap{aspect-ratio:4/3;min-height:0;border-right:0;border-bottom:1px solid var(--line-2)}
  .imgwrap img{padding:14px}
  .rm{top:9px;right:9px}
  .body{padding:13px 15px 15px}
  .stepper{max-width:100%}
  /* o trilho nao precisa ocupar a largura toda de um monitor */
  .steps-in{max-width:760px;padding:7px 12px}
  .who .fields{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .modal{align-items:center;padding:16px}
  .sheet{border-radius:18px}
}
@media (min-width:900px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
  .bar-in{padding:13px 16px}
  .totals .big{font-size:30px}
}
</style>

<div class="top">
  <div class="top-in">
    <div class="brand">

<script>
(function(){
"use strict";
// WhatsApp da Nina (Nitron) — só dígitos, com DDI 55.
var NINA_WA = "5511960390203";
// Desconto por volume no total do pedido
function discountRate(sub){ if(sub>15000)return .15; if(sub>5000)return .10; return 0; }
// Modo interno (vendedor): mostra seletor de segmento, curva e penetração. Cliente não vê.
var ADMIN = (location.hash||"").toLowerCase().indexOf("adm")>=0;
function openLink(url){ var a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener noreferrer"; document.body.appendChild(a); a.click(); setTimeout(function(){a.remove();},0); }

var D = window.DATA || {segs:{},catalogo:[]};
var IMG = window.IMG || {};
var REGORD={Sudeste:1,Nordeste:2,Sul:3,"Centro-Oeste":4,Norte:5};
var fmt=function(n){return (n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});};
var fmtI=function(n){return (n||0).toLocaleString("pt-BR");};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};

var segIds=Object.keys(D.segs).sort(function(a,b){var A=D.segs[a],B=D.segs[b];return (REGORD[A.reg]-REGORD[B.reg])||A.sig.localeCompare(B.sig);});
var curSeg=null;
var cart={};          // codprod -> fardos (fonte única: o carrinho)
var catalog=D.catalogo||[];
var catByCod={}, linhas={}, linhaOrder=[];
catalog.forEach(function(it){ catByCod[it.cod]=it; if(!linhas[it.linha]){linhas[it.linha]=[];linhaOrder.push(it.linha);} linhas[it.linha].push(it); });
var CATPREF=["Linha Potes","Linha Organização","Linha Cozinha","Linha Lixeiras","Linha Banheiro","Linha Frasqueiras","Linha Jarras","Linha Infantil","Linha Micro-ondas","Linha Geladeira","Linha Realce","Linha Coloratto","Linha Limpeza","Decor-Chef","Decor-Confeitaria","POP"];
function isTeca(l){return /^Teca/i.test(l)||/Mob/i.test(l);}
linhaOrder.sort(function(a,b){
  var ta=isTeca(a)?1:0, tb=isTeca(b)?1:0; if(ta!==tb) return ta-tb; // TECA/MOB por último
  var ia=CATPREF.indexOf(a),ib=CATPREF.indexOf(b); ia=ia<0?99:ia; ib=ib<0?99:ib; return (ia-ib)||a.localeCompare(b);});

var activeTab="mine";
var pendAdd={}; // cod -> fardos pendentes (antes de incluir)
var els={};
["seg","ramoTitle","baseN","sugN","tabs","intro","grid","searchWrap","q","whoBox",
 "seg","segselWrap","subInfo","segheadWrap","steps","tGrand","tItens","tFardos","tUn","tDisc","promo","btnResumo","btnPdf","btnWa",
 "modal","mTitle","mSub","mText","mNote","mClose","mCopy","mWa","toast"].forEach(function(id){els[id]=document.getElementById(id);});

function pickSeg(){var h=(location.hash||"").replace(/^#/,"").replace(/~?adm$/i,"").replace(/^adm$/i,""); return (h&&D.segs[h])?h:segIds[0];}
function buildSegSelect(){els.seg.innerHTML=segIds.map(function(id){var s=D.segs[id];return '<option value="'+id+'">'+esc(s.reg)+' · '+esc(s.ramo)+'</option>';}).join("");}

function loadSeg(id){
  curSeg=id; els.seg.value=id; cart={}; pendAdd={};
  var s=D.segs[id];
  (s.itens||[]).forEach(function(it){ if(it.fardos>0) cart[it.cod]=it.fardos; });
  if(ADMIN){ els.ramoTitle.textContent=s.ramo+" · "+s.reg; els.baseN.textContent=fmtI(s.base); els.sugN.textContent=(s.itens||[]).length; }
  try{ if(location.hash.replace(/^#/,"")!==id) history.replaceState(null,"","#"+id); }catch(e){}
  activeTab="mine"; buildTabs(); render(); recompute();
}

function sugMap(){ var m={}; (D.segs[curSeg].itens||[]).forEach(function(it){m[it.cod]=it;}); return m; }
function shortRamo(r){return r.split(" / ")[0].split(",")[0];}

function buildTabs(){
  var t=[];
  t.push('<button class="tab mine" role="tab" data-tab="mine" aria-selected="'+(activeTab==="mine")+'">Meu pedido<span class="cnt" id="mineCnt">'+Object.keys(cart).length+'</span></button>');
  linhaOrder.forEach(function(l){
    var tc=isTeca(l)?" teca":"";
    var label=l.replace(/^Linha /,"");
    t.push('<button class="tab'+tc+'" role="tab" data-tab="'+esc(l)+'" aria-selected="'+(activeTab===l)+'">'+esc(label)+'<span class="cnt">'+linhas[l].length+'</span>'+(isTeca(l)?'<span class="dot" title="linha nova"></span>':'')+'</button>');
  });
  els.tabs.innerHTML=t.join("");
  Array.prototype.forEach.call(els.tabs.querySelectorAll(".tab"),function(b){
    b.onclick=function(){activeTab=b.getAttribute("data-tab");
      Array.prototype.forEach.call(els.tabs.querySelectorAll(".tab"),function(x){x.setAttribute("aria-selected",x===b);});
      render(); window.scrollTo({top:0,behavior:"smooth"});};
  });
}
function setMineCnt(){var e=document.getElementById("mineCnt"); if(e)e.textContent=Object.keys(cart).length;}

function resolveItem(cod){ var sm=sugMap(); if(sm[cod]) return normSug(sm[cod]); if(catByCod[cod]) return normCat(catByCod[cod]); return null; }
function normSug(it){return {cod:it.cod,ref:it.ref,desc:it.desc,linha:it.linha,emb:it.emb||1,preco:it.preco||0,img:it.img,pen:it.pen,curva:it.curva,sug:true};}
function normCat(c){var sm=sugMap(); var b={cod:c.cod,ref:c.ref,desc:c.desc,linha:c.linha,emb:c.emb||1,preco:c.preco||0,img:c.img,pen:null,curva:null,sug:false}; if(sm[c.cod]){b.pen=sm[c.cod].pen;b.curva=sm[c.cod].curva;b.sug=true;} return b;}

function itemsForTab(){
  if(activeTab==="mine"){
    // carrinho: sugeridos primeiro (A,B,C), depois incluídos à mão
    var rank={A:0,B:1,C:2};
    var arr=Object.keys(cart).map(function(cod){return resolveItem(+cod);}).filter(Boolean);
    arr.sort(function(a,b){var as=a.sug?0:1,bs=b.sug?0:1; if(as!==bs)return as-bs; var ar=a.curva in rank?rank[a.curva]:9,br=b.curva in rank?rank[b.curva]:9; return (ar-br)||(a.desc||"").localeCompare(b.desc||"");});
    return arr;
  }
  var list=(linhas[activeTab]||[]).map(normCat);
  var q=(els.q.value||"").trim().toLowerCase();
  if(q) list=list.filter(function(c){return (c.desc||"").toLowerCase().indexOf(q)>=0||(c.ref||"").toLowerCase().indexOf(q)>=0;});
  // em cart primeiro
  list.sort(function(a,b){var ac=cart[a.cod]?0:1,bc=cart[b.cod]?0:1; if(ac!==bc)return ac-bc; return (a.desc||"").localeCompare(b.desc||"");});
  return list;
}

function badgeFor(it){
  if(ADMIN){ if(it.curva==="A")return '<span class="badge a">CURVA A</span>'; if(it.curva==="B")return '<span class="badge b">CURVA B</span>'; if(it.curva==="C")return '<span class="badge c">CURVA C</span>'; }
  if(isTeca(it.linha)) return '<span class="badge n">NOVA</span>';
  return "";
}
function penFor(it){
  if(ADMIN && it.pen!=null){var s=D.segs[curSeg];return '<div class="pen">'+Math.round(it.pen*100)+'% das lojas de '+esc(shortRamo(s.ramo))+' compram</div>';}
  if(isTeca(it.linha)) return '<div class="pen" style="color:var(--violet)">Linha nova — experimente um mix</div>';
  return '';
}

function cardHTML(it){
  var inCart=cart[it.cod]>0;
  var f=cart[it.cod]||0;
  var src=IMG[it.cod];
  var img=src?('<img src="'+src+'" loading="lazy" alt="" onerror="this.style.display=\'none\';this.parentNode.querySelector(\'.ph\').style.display=\'flex\'">'):'';
  var mine=activeTab==="mine";
  var pf=inCart?f:(pendAdd[it.cod]||1);
  var un=pf*it.emb, tot=un*it.preco;
  // O lojista pensa em FARDO, mas decide pela peca e pelo dinheiro. A conta fica escrita por extenso
  // embaixo do controle, e muda enquanto ele toca no + e no -.
  var conta='<div class="conta" data-conta="'+it.cod+'">'+contaTxt(it,pf)+'</div>';
  var ctrl;
  if(inCart){
    ctrl='<div class="ctrl">'
      +'<div class="stepper" data-cod="'+it.cod+'"><button class="dec" aria-label="Menos um fardo">−</button>'
      +'<input class="qf" inputmode="numeric" value="'+f+'" aria-label="Quantidade de fardos"><button class="inc" aria-label="Mais um fardo">+</button></div>'
      +conta
      +'<button class="rmlink" data-rm="'+it.cod+'">tirar do pedido</button></div>';
  } else {
    ctrl='<div class="ctrl">'
      +'<div class="stepper" data-pend="'+it.cod+'"><button class="pdec" aria-label="Menos um fardo">−</button>'
      +'<input class="pqf" inputmode="numeric" value="'+pf+'" aria-label="Fardos a incluir"><button class="pinc" aria-label="Mais um fardo">+</button></div>'
      +conta
      +'<button class="addbtn" data-add="'+it.cod+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Incluir no pedido</button></div>';
  }
  var rmBtn = mine?('<button class="rm" data-rm="'+it.cod+'" aria-label="Tirar do pedido">×</button>'):'';
  return '<div class="card'+(inCart?" incart":"")+'" data-cod="'+it.cod+'">'
    +'<div class="imgwrap">'+img+'<div class="ph" style="'+(src?"":"display:flex")+'">'+esc(it.ref)+'</div>'
      +badgeFor(it)+rmBtn+'</div>'
    +'<div class="body">'
      +(inCart?'<div class="incartlbl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>No seu pedido</div>':'')
      +'<div class="desc">'+esc(it.desc)+'</div>'
      +'<div class="ref">Ref '+esc(it.ref)+' · R$ '+fmt(it.preco)+' a peça</div>'
      +penFor(it)
      +ctrl
    +'</div></div>';
}
function contaTxt(it,f){
  var un=f*it.emb, tot=un*it.preco;
  if(!f) return '<b>'+it.emb+' peças</b> em cada fardo';
  return '<b>'+f+'</b> fardo'+(f>1?'s':'')+' = <b>'+fmtI(un)+'</b> peças · <span class="v">R$ '+fmt(tot)+'</span>';
}
function renderSteps(){
  var n=Object.keys(cart).length, mine=activeTab==="mine";
  var st=[{n:1,l:'Confira<span class="longo"> a lista</span>',done:true,on:false},
          {n:2,l:'Ajuste<span class="longo"> as quantidades</span>',done:n>0,on:mine},
          {n:3,l:'Envie<span class="longo"> para a Nina</span>',done:false,on:!mine&&n>0}];
  els.steps.innerHTML=st.map(function(s){
    return '<div class="step'+(s.on?" on":"")+(s.done?" done":"")+'">'
      +'<span class="n">'+s.n+'</span><span class="l">'+s.l+'</span></div>';
  }).join("");
}
function render(){
  var showSearch=activeTab!=="mine";
  els.searchWrap.hidden=!showSearch;
  var s=D.segs[curSeg];
  if(activeTab==="mine"){
    els.intro.innerHTML= ADMIN
      ? '<b>Seu pedido</b> — cesta sugerida para <b>'+esc(s.ramo)+'</b> no <b>'+esc(s.reg)+'</b>. Curva e penetração visíveis (modo interno). Preço tabela padrão PV-0003.'
      : '<b>Já deixamos este pedido pronto para a sua loja.</b> Use o <b>+</b> e o <b>−</b> para mudar a quantidade de cada produto. Para tirar um produto, toque em <b>tirar do pedido</b>. Quer mais coisas? Toque nas categorias lá em cima. No fim, toque no botão verde <b>Enviar</b>.';
  } else {
    var teca=isTeca(activeTab);
    els.intro.innerHTML=(teca?'<span class="chip n">LINHA NOVA</span> ':'')
      +'Escolha quantos fardos você quer e toque em <b>Incluir no pedido</b>. Os produtos com a borda vermelha já estão no seu pedido.';
  }
  var list=itemsForTab();
  if(!list.length){
    renderSteps();
  els.grid.innerHTML=activeTab==="mine"
      ?'<div class="empty"><b>Seu pedido está vazio</b>Toque numa categoria aqui em cima para escolher produtos.</div>'
      :'<div class="empty"><b>Nada encontrado</b>Tente outro nome, ou apague a busca para ver tudo.</div>';
    return;
  }
  els.grid.innerHTML=list.map(cardHTML).join("");
  wireCards();
  renderSteps();
}

function wireCards(){
  Array.prototype.forEach.call(els.grid.querySelectorAll(".stepper[data-cod]"),function(st){
    var cod=+st.getAttribute("data-cod");
    st.querySelector(".inc").onclick=function(){setQ(cod,(cart[cod]||0)+1);};
    st.querySelector(".dec").onclick=function(){setQ(cod,(cart[cod]||0)-1);};
    var inp=st.querySelector(".qf");
    inp.onchange=function(){var v=parseInt(inp.value.replace(/\D/g,""),10);setQ(cod,isNaN(v)?0:v);};
    inp.onfocus=function(){inp.select();};
  });
  Array.prototype.forEach.call(els.grid.querySelectorAll(".stepper[data-pend]"),function(st){
    var cod=+st.getAttribute("data-pend"); var inp=st.querySelector(".pqf");
    function set(v){v=Math.max(1,Math.min(999,v|0));pendAdd[cod]=v;inp.value=v;
      var it=resolveItem(cod),ct=st.parentNode.querySelector(".conta"); if(it&&ct)ct.innerHTML=contaTxt(it,v);}
    st.querySelector(".pinc").onclick=function(){set((pendAdd[cod]||1)+1);};
    st.querySelector(".pdec").onclick=function(){set((pendAdd[cod]||1)-1);};
    inp.onchange=function(){var v=parseInt(inp.value.replace(/\D/g,""),10);set(isNaN(v)?1:v);};
    inp.onfocus=function(){inp.select();};
  });
  Array.prototype.forEach.call(els.grid.querySelectorAll("[data-add]"),function(b){
    b.onclick=function(){var cod=+b.getAttribute("data-add"); var q=pendAdd[cod]||1; cart[cod]=q; delete pendAdd[cod];
      var it=resolveItem(cod); replaceCard(cod); setMineCnt(); recompute(); toast((it?it.desc.split(" ").slice(0,3).join(" "):"Item")+" · "+q+" fardo(s) no pedido");};
  });
  Array.prototype.forEach.call(els.grid.querySelectorAll("[data-rm]"),function(b){
    b.onclick=function(){var cod=+b.getAttribute("data-rm"); delete cart[cod]; setMineCnt(); recompute();
      if(activeTab==="mine"){ var c=els.grid.querySelector('.card[data-cod="'+cod+'"]'); if(c)c.remove(); if(!Object.keys(cart).length)render(); }
      else replaceCard(cod); };
  });
}
function replaceCard(cod){
  var c=els.grid.querySelector('.card[data-cod="'+cod+'"]'); if(!c)return;
  var it=resolveItem(cod); if(!it)return;
  var tmp=document.createElement("div"); tmp.innerHTML=cardHTML(it);
  c.replaceWith(tmp.firstChild); wireCards();
}
function setQ(cod,v){
  v=Math.max(0,Math.min(9999,v|0));
  if(v<=0){ delete cart[cod];
    if(activeTab==="mine"){var c=els.grid.querySelector('.card[data-cod="'+cod+'"]');if(c)c.remove(); if(!Object.keys(cart).length)render();}
    else replaceCard(cod);
    setMineCnt(); recompute(); return;
  }
  cart[cod]=v; updateCard(cod); setMineCnt(); recompute();
}
function updateCard(cod){
  var card=els.grid.querySelector('.card[data-cod="'+cod+'"]'); if(!card)return;
  var it=resolveItem(cod); if(!it)return; var f=cart[cod]||0;
  var st=card.querySelector('.stepper[data-cod]'); if(st){st.querySelector(".qf").value=f;}
  var ct=card.querySelector(".conta"); if(ct)ct.innerHTML=contaTxt(it,f);
}

function orderLines(){
  var rank={A:0,B:1,C:2};
  var out=Object.keys(cart).map(function(cod){var it=resolveItem(+cod); if(!it||cart[cod]<=0)return null; return {it:it,fardos:cart[cod],un:cart[cod]*it.emb,tot:cart[cod]*it.emb*it.preco};}).filter(Boolean);
  out.sort(function(a,b){var as=a.it.sug?0:1,bs=b.it.sug?0:1; if(as!==bs)return as-bs; var ar=a.it.curva in rank?rank[a.it.curva]:9,br=b.it.curva in rank?rank[b.it.curva]:9; return (ar-br)||b.tot-a.tot;});
  return out;
}
function recompute(){
  if(els.steps)renderSteps();
  var lines=orderLines(),sub=0,un=0,far=0;
  lines.forEach(function(l){sub+=l.tot;un+=l.un;far+=l.fardos;});
  var rate=discountRate(sub),disc=sub*rate,total=sub-disc;
  els.tGrand.textContent=fmt(total); els.tItens.textContent=lines.length; els.tFardos.textContent=fmtI(far); els.tUn.textContent=fmtI(un);
  if(rate>0){els.tDisc.hidden=false;els.tDisc.innerHTML='Subtotal <s>R$ '+fmt(sub)+'</s> · <b>desconto '+Math.round(rate*100)+'% −R$ '+fmt(disc)+'</b>';}
  else els.tDisc.hidden=true;
  var p=els.promo;
  if(sub<=0){p.hidden=true;}
  else if(sub<=5000){p.hidden=false;p.className="promo go";p.innerHTML="Compre mais <b>R$ "+fmt(5000-sub)+"</b> e ganhe <b>10% de desconto</b> no pedido";}
  else if(sub<=15000){p.hidden=false;p.className="promo go";p.innerHTML="Você já ganhou <b>10% de desconto</b>! Compre mais <b>R$ "+fmt(15000-sub)+"</b> e suba para <b>15%</b>";}
  else {p.hidden=false;p.className="promo win";p.innerHTML="Parabéns! Seu pedido ganhou o <b>desconto máximo de 15%</b>";}
}
function orderTotals(){var lines=orderLines(),sub=0,un=0,far=0;lines.forEach(function(l){sub+=l.tot;un+=l.un;far+=l.fardos;});var rate=discountRate(sub);return {lines:lines,sub:sub,rate:rate,disc:sub*rate,total:sub*(1-rate),un:un,far:far};}

function clientBlock(){
  var g=function(id){return els.whoBox.querySelector(id).value.trim();};
  var l=[]; var loja=g("#f_loja"),cnpj=g("#f_cnpj"),cid=g("#f_cidade"),fone=g("#f_fone");
  if(loja)l.push("Loja: "+loja); if(cnpj)l.push("CNPJ: "+cnpj); if(cid)l.push("Cidade: "+cid); if(fone)l.push("WhatsApp: "+fone); return l;
}
function orderText(){
  var s=D.segs[curSeg]; var t=orderTotals(); var lines=t.lines;
  var L=["*PEDIDO NITRON*","Segmento: "+s.ramo+" · "+s.reg];
  var cb=clientBlock(); if(cb.length)L=L.concat(cb); L.push("");
  lines.forEach(function(l,i){
    var mark=ADMIN?(l.it.curva?(" ["+l.it.curva+"]"):(isTeca(l.it.linha)?" [NOVA]":"")):"";
    L.push((i+1)+". "+l.it.desc+" (Ref "+l.it.ref+")"+mark);
    L.push("   "+l.fardos+" fardo(s) x "+l.it.emb+" un = "+fmtI(l.un)+" un x R$ "+fmt(l.it.preco)+" = R$ "+fmt(l.tot));});
  L.push(""); L.push("Itens: "+lines.length+" produtos · "+fmtI(t.far)+" fardos · "+fmtI(t.un)+" unidades");
  if(t.rate>0){L.push("Subtotal: R$ "+fmt(t.sub));L.push("Desconto "+Math.round(t.rate*100)+"%: -R$ "+fmt(t.disc));}
  L.push("*VALOR TOTAL: R$ "+fmt(t.total)+"*"); return L.join("\n");
}
function waURL(){var txt=encodeURIComponent(orderText());return (NINA_WA?("https://wa.me/"+NINA_WA.replace(/\D/g,"")+"?text="):"https://wa.me/?text=")+txt;}

function openModal(){
  var lines=orderLines(); if(!lines.length){toast("Seu pedido está vazio — inclua itens primeiro.");return;}
  els.mText.textContent=orderText(); els.mSub.textContent=D.segs[curSeg].ramo+" · "+D.segs[curSeg].reg;
  els.mNote.innerHTML=NINA_WA?'Ao abrir o WhatsApp, o pedido já vai escrito — é só enviar para a Nina confirmar estoque e condição do seu canal.':'<b>WhatsApp da Nina ainda não configurado.</b> Copie o pedido e envie para o contato da Nina, ou peça para publicarmos esta página no domínio da Nitron (aí o envio e o PDF ficam automáticos).';
  els.mWa.style.display=NINA_WA?"":"none"; els.modal.hidden=false;
}
function closeModal(){els.modal.hidden=true;}
function copyText(txt,ok){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(ok||"Copiado!");},selectPre);} else selectPre(); }
function selectPre(){var r=document.createRange();r.selectNodeContents(els.mText);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);toast("Selecionado — use Ctrl+C.");}

function makePDF(){
  var lines=orderLines(); if(!lines.length){toast("Seu pedido está vazio.");return;}
  var jsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF; if(!jsPDF){toast("PDF indisponível aqui — use Copiar pedido.");return;}
  var s=D.segs[curSeg]; var doc=new jsPDF({unit:"pt",format:"a4"});
  var W=doc.internal.pageSize.getWidth(),M=40,y=54;
  doc.setFillColor(29,58,95);doc.rect(0,0,W,40,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text("NITRON — Pedido",M,26);
  doc.setTextColor(20,27,36);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(s.ramo+"  ·  "+s.reg,M,y);y+=15;
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(86,98,111);
  clientBlock().forEach(function(t){doc.text(t,M,y);y+=12;});
  doc.text("Emitido em "+new Date().toLocaleDateString("pt-BR"),M,y);y+=16;
  function hdr(){doc.setFillColor(238,240,236);doc.rect(M,y,W-2*M,18,"F");doc.setFont("helvetica","bold");doc.setFontSize(8);doc.setTextColor(40,50,62);
    doc.text("Produto",M+4,y+12);doc.text("Fardos",W-M-210,y+12,{align:"right"});doc.text("Un",W-M-150,y+12,{align:"right"});doc.text("R$/un",W-M-95,y+12,{align:"right"});doc.text("Total R$",W-M-4,y+12,{align:"right"});y+=22;}
  hdr();var grand=0,un=0,far=0;doc.setFont("helvetica","normal");doc.setFontSize(8.5);
  lines.forEach(function(l){ if(y>780){doc.addPage();y=54;hdr();doc.setFont("helvetica","normal");doc.setFontSize(8.5);}
    grand+=l.tot;un+=l.un;far+=l.fardos; doc.setTextColor(20,27,36);
    var mark=ADMIN?(l.it.curva?("  ["+l.it.curva+"]"):(isTeca(l.it.linha)?"  [NOVA]":"")):"";
    var name=l.it.desc; if(name.length>52)name=name.substring(0,50)+"…"; doc.text(name+mark,M+4,y);
    doc.setTextColor(86,98,111);doc.setFontSize(7.5);doc.text("Ref "+l.it.ref+" · fardo "+l.it.emb+" un",M+4,y+10);
    doc.setFontSize(8.5);doc.setTextColor(20,27,36);
    doc.text(String(l.fardos),W-M-210,y,{align:"right"});doc.text(fmtI(l.un),W-M-150,y,{align:"right"});doc.text(fmt(l.it.preco),W-M-95,y,{align:"right"});
    doc.setFont("helvetica","bold");doc.text(fmt(l.tot),W-M-4,y,{align:"right"});doc.setFont("helvetica","normal");
    y+=22;doc.setDrawColor(236,238,234);doc.line(M,y-6,W-M,y-6);});
  y+=6;doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(20,27,36);doc.text(lines.length+" produtos · "+fmtI(far)+" fardos · "+fmtI(un)+" unidades",M,y);y+=15;
  var rate=discountRate(grand);
  if(rate>0){doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(86,98,111);
    doc.text("Subtotal:  R$ "+fmt(grand),M,y);y+=13;
    doc.setTextColor(21,127,74);doc.text("Desconto "+Math.round(rate*100)+"%:  -R$ "+fmt(grand*rate),M,y);y+=15;doc.setTextColor(20,27,36);}
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text("VALOR TOTAL:  R$ "+fmt(grand*(1-rate)),M,y);
  try{ doc.save("Pedido-Nitron-"+curSeg+".pdf"); toast("PDF gerado."); }
  catch(e){ try{ openLink(doc.output("bloburl")); }catch(e2){ toast("Baixe o PDF na versão publicada no domínio da Nitron."); } }
}

var toTimer; function toast(m){els.toast.textContent=m;els.toast.classList.add("show");clearTimeout(toTimer);toTimer=setTimeout(function(){els.toast.classList.remove("show");},2600);}

els.seg.onchange=function(){loadSeg(els.seg.value);window.scrollTo({top:0});};
els.q.oninput=function(){if(activeTab!=="mine")render();};
els.btnResumo.onclick=openModal;
els.btnWa.onclick=function(){var lines=orderLines();if(!lines.length){toast("Seu pedido está vazio.");return;} if(NINA_WA){openLink(waURL());}else{openModal();}};
els.btnPdf.onclick=makePDF;
els.mClose.onclick=closeModal; els.modal.onclick=function(e){if(e.target===els.modal)closeModal();};
els.mCopy.onclick=function(){copyText(orderText(),"Pedido copiado!");};
els.mWa.onclick=function(){openLink(waURL());};
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!els.modal.hidden)closeModal();});
(function(){
  // A barra cresce e encolhe (promocao aparece, desconto aparece). Reservar uma altura fixa no CSS
  // escondia produto atras dela em telefone pequeno — entao ela se mede e avisa o corpo.
  var bar=document.querySelector(".bar");
  function medir(){ if(bar) document.documentElement.style.setProperty("--barh", Math.ceil(bar.getBoundingClientRect().height)+"px"); }
  medir();
  if(window.ResizeObserver){ new ResizeObserver(medir).observe(bar); }
  window.addEventListener("resize",medir); window.addEventListener("orientationchange",medir);
  setTimeout(medir,300); setTimeout(medir,1200);
})();
window.addEventListener("hashchange",function(){var h=location.hash.replace(/^#/,"");if(D.segs[h]&&h!==curSeg)loadSeg(h);});

if(ADMIN){ els.segselWrap.hidden=false; els.subInfo.hidden=false; els.segheadWrap.hidden=false; buildSegSelect(); }
loadSeg(pickSeg());
})();
</script>
